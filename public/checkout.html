<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - BAAD-Shop</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="container">
            <a href="index.html" class="brand">BAAD-Shop</a>
            <nav class="nav">
                <a href="index.html">Catalog</a>
                <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
                <a href="profile.html">Profile</a>
                <a href="admin.html" id="admin-link" style="display: none;">Admin</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>Checkout</h1>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 3rem; margin-top: 2rem;">
            <!-- Shipping Form -->
            <div>
                <div class="card">
                    <div class="card-content">
                        <h3>Shipping Information</h3>

                        <form id="checkout-form">
                            <div class="form-group">
                                <label class="form-label">Full Name</label>
                                <input type="text" id="fullName" class="form-input" required>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Street Address</label>
                                <input type="text" id="street" class="form-input" required>
                            </div>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                                <div class="form-group">
                                    <label class="form-label">City</label>
                                    <input type="text" id="city" class="form-input" required>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">Postal Code</label>
                                    <input type="text" id="postalCode" class="form-input" required>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Country</label>
                                <input type="text" id="country" class="form-input" value="Kazakhstan" required>
                            </div>

                            <h4 class="mt-3">Payment Information</h4>
                            <div class="form-group">
                                <label class="form-label">Payment Method</label>
                                <select id="paymentProvider" class="form-input">
                                    <option value="cash">Cash on Delivery</option>
                                    <option value="card">Credit/Debit Card</option>
                                    <option value="kaspi">Kaspi Pay</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary" style="width: 100%;">
                                Place Order
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Order Summary -->
            <div>
                <div class="card">
                    <div class="card-content">
                        <h3>Order Summary</h3>

                        <div id="order-items" style="margin-top: 1.5rem;">
                            <p class="text-muted">Loading...</p>
                        </div>

                        <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 2px solid var(--border);">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                                <span>Subtotal:</span>
                                <strong id="order-subtotal">0 KZT</strong>
                            </div>
                            <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                                <span>Shipping:</span>
                                <strong>Free</strong>
                            </div>
                            <div
                                style="display: flex; justify-content: space-between; font-size: 1.25rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border);">
                                <span><strong>Total:</strong></span>
                                <strong id="order-total" class="price">0 KZT</strong>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 BAAD-Shop. All rights reserved.</p>
    </footer>

    <script type="module" src="js/baadshop.js"></script>
    <script type="module" src="js/checkout.js"></script>
</body>

</html>
